{% extends "layout.html" %}
{% block content %}
{% if let Some(id) = id %}
<h1>Edit donor</h1>
{% else %}
<h1>New donor</h1>
{% endif %}

{% if let Some(msg) = error %}
<div class="error">{{ msg }}</div>
{% endif %}

<form method="post" action="{% if let Some(id) = id %}/donors/{{ id }}/edit{% else %}/donors{% endif %}">
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ draft.name }}" required autofocus>
  </div>
  <div class="field">
    <label for="contact_info">Contact info</label>
    <input type="text" id="contact_info" name="contact_info" value="{{ draft.contact_info }}">
  </div>
  <div class="field">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="3">{{ draft.notes }}</textarea>
  </div>
  <div class="actions">
    <button type="submit">Save</button>
    <a class="button secondary" href="/donors">Cancel</a>
  </div>
</form>
{% endblock %}
