<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adm-sfa</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
  header { background: #2b3a4a; color: #fff; padding: 0.75rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
  header a { color: #fff; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header .brand { font-weight: 600; margin-right: 1rem; }
  main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
  th { background: #f4f4f4; }
  form.inline { display: inline; }
  .field { margin-bottom: 0.9rem; }
  .field label { display: block; font-weight: 600; margin-bottom: 0.2rem; }
  .field input[type=text], .field input[type=date], .field input[type=password],
  .field textarea, .field select { width: 100%; max-width: 400px; padding: 0.35rem; box-sizing: border-box; }
  .error { background: #fde8e8; color: #a30000; padding: 0.6rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
  .actions { margin-top: 1rem; display: flex; gap: 0.6rem; }
  button, .button { background: #2b3a4a; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.secondary, .button.secondary { background: #888; }
  button.danger, .button.danger { background: #a30000; }
</style>
</head>
<body>
<header>
  <span class="brand">adm-sfa</span>
  <a href="/purchases">Purchases</a>
  <a href="/donors">Donors</a>
  <span style="margin-left: auto;"><a href="/logout">Log out</a></span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
